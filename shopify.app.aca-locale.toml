# Learn more about configuring your app at:
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "29e62e43d9461e28900806bb7fa959ff"
name = "aca-locale"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

# ------------------------------------------------------------
# App lifecycle
# ------------------------------------------------------------

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

# ------------------------------------------------------------
# Mandatory Shopify App Store privacy webhooks
# ------------------------------------------------------------

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/webhooks/customers/data-request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/webhooks/shop/redact"

# ------------------------------------------------------------
# Shopify API scopes
# ------------------------------------------------------------

[access_scopes]
scopes = "read_locales,read_markets,read_translations,write_translations"

# ------------------------------------------------------------
# OAuth
# ------------------------------------------------------------

[auth]
redirect_urls = [
  "https://example.com/api/auth"
]
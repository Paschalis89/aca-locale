services:
  postgres:
    image: postgres:16-alpine
    container_name: aca-locale-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aca_locale
      POSTGRES_USER: aca_locale
      POSTGRES_PASSWORD: aca_locale_dev

    ports:
      - "5434:5432"

    volumes:
      - aca_locale_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aca_locale -d aca_locale"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aca-locale-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6380:6379"

    volumes:
      - aca_locale_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aca_locale_postgres_data:
  aca_locale_redis_data:
